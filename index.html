<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>idollink</title>

<style>
body { font-family: sans-serif; padding: 20px; }

.area { margin-bottom: 20px; }

.artist {
  padding: 10px;
  margin: 8px 0;
  background: #eee;
  border-radius: 10px;
  cursor: pointer;
}

.song-list { margin-left: 10px; display: none; }

.song {
  padding: 6px;
  cursor: pointer;
  border-radius: 6px;
}

.song:hover { background: #f5f5f5; }

.selected { background: #cce5ff; }

.highlight {
  background: #ffe58a;
  padding: 2px 4px;
  border-radius: 4px;
}

#recommend {
  position: sticky;
  bottom: 0;
  background: white;
  padding: 10px;
  border-top: 2px solid #ccc;
  max-height: 300px;
  overflow-y: auto;
}
</style>
</head>

<body>

<h1>idollink</h1>

<div class="area">
<h2>選択中（1曲）</h2>
<div id="selected"></div>
</div>

<div class="area">
<h2>曲を選ぶ</h2>
<div id="list"></div>
</div>

<div id="recommend">
<h2>おすすめ</h2>
<div id="rec"></div>
</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyiJX0Evxs_yQOHIWMClP0bOGOIWyeC1ZXCBbiEzZAJ6kzessgwU5NWCJEAku7yWFzahKmdxkDOt4s/pub?gid=0&single=true&output=csv";

let songs = [];
let selectedSong = null;

const listDiv = document.getElementById("list");
const selectedDiv = document.getElementById("selected");
const recDiv = document.getElementById("rec");

fetch(url)
.then(res => res.text())
.then(text => {
  const rows = text.trim().split("\n").slice(1);

  songs = rows.map(row => {
    const c = row.split(",");
    return {
      id: c[0],
      title: c[1],
      artist: c[2],
      composer: c[3],
      lyricist: c[4],
      arranger: c[5],
      tags: c[6] ? c[6].split(" ") : []
    };
  });

  render();
});

// 曲一覧
function renderList() {
  listDiv.innerHTML = "";

  const grouped = {};
  songs.forEach(s => {
    if (!grouped[s.artist]) grouped[s.artist] = [];
    grouped[s.artist].push(s);
  });

  Object.keys(grouped).forEach(artist => {
    const btn = document.createElement("div");
    btn.className = "artist";
    btn.textContent = artist;

    const songList = document.createElement("div");
    songList.className = "song-list";

    btn.onclick = () => {
      songList.style.display =
        songList.style.display === "none" ? "block" : "none";
    };

    grouped[artist].forEach(s => {
      const div = document.createElement("div");
      div.className = "song";

      if (selectedSong === s.id) {
        div.classList.add("selected");
      }

      div.textContent = s.title;

      div.onclick = (e) => {
        e.stopPropagation();
        toggleSelect(s.id);
      };

      songList.appendChild(div);
    });

    listDiv.appendChild(btn);
    listDiv.appendChild(songList);
  });
}

// 選択
function toggleSelect(id) {
  selectedSong = (selectedSong === id) ? null : id;
  render();
}

// 選択表示
function renderSelected() {
  if (!selectedSong) {
    selectedDiv.innerHTML = "曲を選択してください";
    return;
  }

  const s = songs.find(x => x.id === selectedSong);

  selectedDiv.innerHTML = `
    <div>
      ${s.title} / ${s.artist}<br>
      作曲: ${s.composer} / 作詞: ${s.lyricist} / 編曲: ${s.arranger}<br>
      タグ: ${s.tags.join(", ")}
    </div>
  `;
}

// ★
function scoreToStars(score) {
  if (score >= 10) return "★★★★★";
  if (score >= 7) return "★★★★";
  if (score >= 4) return "★★★";
  if (score >= 2) return "★★";
  return "★";
}

// ハイライト関数
function highlight(text, isMatch) {
  return isMatch ? `<span class="highlight">${text}</span>` : text;
}

// おすすめ
function renderRecommend() {
  if (!selectedSong) {
    recDiv.innerHTML = "曲を選ぶとおすすめが出ます";
    return;
  }

  const base = songs.find(s => s.id === selectedSong);

  const results = songs
    .map(s => {
      if (s.id === base.id) return null;

      let score = 0;
      let reasons = [];

      const composerMatch = s.composer === base.composer;
      const arrangerMatch = s.arranger === base.arranger;
      const lyricistMatch = s.lyricist === base.lyricist;
      const commonTags = s.tags.filter(t => base.tags.includes(t));

      if (composerMatch) { score += 5; reasons.push("作曲"); }
      if (arrangerMatch) { score += 4; reasons.push("編曲"); }
      if (lyricistMatch) { score += 4; reasons.push("作詞"); }

      if (commonTags.length) {
        score += commonTags.length;
        reasons.push(`タグ:${commonTags.join(",")}`);
      }

      if (score === 0) return null;

      return {
        ...s,
        score,
        reasons,
        composerMatch,
        arrangerMatch,
        lyricistMatch,
        commonTags
      };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);

  recDiv.innerHTML = results.length
    ? results.map(r => `
      <div style="margin-bottom:10px;">
        ・${r.title} / ${r.artist}　${scoreToStars(r.score)}<br>
        <small>
        作曲: ${highlight(r.composer, r.composerMatch)} /
        作詞: ${highlight(r.lyricist, r.lyricistMatch)} /
        編曲: ${highlight(r.arranger, r.arrangerMatch)}<br>
        タグ: ${r.tags.map(t =>
          highlight(t, r.commonTags.includes(t))
        ).join(", ")}<br>
        理由: ${r.reasons.join(" / ")}
        </small>
      </div>
    `).join("")
    : "おすすめ曲：0曲";
}

// 再描画
function render() {
  renderList();
  renderSelected();
  renderRecommend();
}
</script>

</body>
</html>
